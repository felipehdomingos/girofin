name: Deploy staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          APP_ENV: staging

      # So as tabelas de autenticacao nascem em runtime; o schema financeiro nao.
      # Sem este passo, `categories` e companhia dependem de alguem lembrar de
      # rodar `npm run db:apply` na mao. Roda antes do deploy para o codigo novo
      # encontrar o banco pronto, e e pulado quando o segredo nao esta
      # configurado, para nao derrubar um deploy que hoje passa.
      - name: Aplica o schema do banco
        if: env.DATABASE_URL != ''
        run: npm run db:apply

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .next/standalone
